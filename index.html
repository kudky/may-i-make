<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAY I MAKE</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --bg-color: #f4f6f9;
        }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg-color); margin: 0; padding: 10px; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h1 { margin: 0; color: var(--primary); font-size: 22px; }
        
        .main-layout { display: grid; grid-template-columns: 2.5fr 1.5fr; gap: 15px; }
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }
        
        .panel { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .user-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; border-radius: 6px; margin-bottom: 5px; }
        .user-row:hover { background: #fff0f0; }
        
        /* 캘린더 스타일 고정 */
        .calendar-header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; font-size: 15px; }
        .calendar-header-nav button { background: #eee; color: #333; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; width: auto; margin: 0; font-size: 12px; }
        .calendar-header-nav button:hover { background: #ddd; }
        
        .calendar-table { width: 100%; border-collapse: collapse; text-align: center; table-layout: fixed; }
        .calendar-table th { font-size: 12px; color: #777; padding-bottom: 6px; width: 14.28%; }
        .calendar-table td { padding: 3px; width: 14.28%; }
        
        .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; border-radius: 6px; background: #fafafa; cursor: pointer; transition: all 0.1s; border: 1px solid #eee; }
        .cal-day:hover { background: #fff0f0; border-color: var(--primary); transform: scale(1.05); font-weight: bold; }
        .cal-day.empty { background: transparent; border: none; cursor: default; }
        .cal-day.today { border: 2px solid var(--primary); font-weight: bold; }
        .cal-day.selected { background: #ffe3e3; border-color: var(--primary); font-weight: bold; }
        
        input, select, textarea { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
        button { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        button:hover { opacity: 0.9; }
        .flex-group { display: flex; gap: 10px; align-items: center; }
        .header-btns { display: flex; gap: 8px; align-items: center; }
        .error-text { color: #d9534f; font-size: 12px; margin-top: 5px; display: none; }
        .edit-btn { background: #6c757d; font-size: 11px; padding: 4px 8px; width: auto; margin: 0; border-radius: 4px; }
        .add-btn { background: #4caf50; width: 40px; margin: 0; flex-shrink: 0; height: 35px; }
        
        dialog { border: none; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); padding: 20px; width: 300px; }
        dialog::backdrop { background: rgba(0,0,0,0.5); }
    </style>
    
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
    <h1>MAY I MAKE</h1>
    <div class="header-btns">
        <button type="button" onclick="document.getElementById('admin-modal-dialog').showModal()" style="width:auto; padding:5px 12px; background:#6c757d;">⚙️ 관리자</button>
        <div id="auth-status">
            <button type="button" onclick="document.getElementById('auth-modal-dialog').showModal()" style="width:auto; padding:5px 15px;">로그인 / 회원가입</button>
        </div>
    </div>
</header>

<div class="main-layout">
    <div class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="view-date-title">🔥 데일리 현황 (기준: 오전 05시 ~ 익일 05시)</h3>
            <span id="global-goals-summary" style="font-size: 12px; color: #666;">공동 목표 불러오는 중...</span>
        </div>
        <div id="user-rows-container">
            <p>사용자 목록을 불러오는 중입니다...</p>
        </div>
        
        <hr style="margin: 20px 0; border:0; border-top:1px solid #eee;">
        
        <div id="record-input-section" style="display:none;">
            <h4 id="input-title">📝 오늘 진척도 및 목표 기록하기</h4>
            <div class="flex-group">
                <input type="text" id="input-today-goal" placeholder="오늘의 새로운 목표 (예: 오늘 간식 안 먹기!)" style="background: #fff9f9; border-color: #ff6b6b;">
            </div>
            <div class="flex-group">
                <input type="text" id="input-food" placeholder="먹은 것 (예: 닭가슴살 샐러드, 콜라 1캔)">
                <input type="number" id="input-water" placeholder="마신 물 (ml)">
            </div>
            <div class="flex-group">
                <input type="number" id="input-steps" placeholder="걸음 수">
                <input type="number" id="input-distance" step="0.1" placeholder="걸은 거리 (km)">
            </div>
            
            <div id="exercise-list-container">
                <div class="flex-group exercise-row">
                    <select class="input-body-part">
                        <option value="전신">전신 운동</option>
                        <option value="상체">상체 운동</option>
                        <option value="하체">하체 운동</option>
                        <option value="코어">코어 운동</option>
                    </select>
                    <input type="number" class="input-exercise-time" placeholder="운동 시간 (분)">
                    <button type="button" class="add-btn" onclick="addExerciseRow()">+</button>
                </div>
            </div>

            <input type="text" id="input-youtube" placeholder="본 유튜브 운동 영상 제목 또는 링크">
            <input type="color" id="input-color" value="#ff6b6b" title="내 진척도 그라데이션 색상 선택" style="height:35px; padding:2px;">
            <button type="button" id="save-btn" onclick="submitDailyRecord()">기록 저장 / 수정하기</button>
        </div>
    </div>

    <!-- 월별 캘린더 패널 -->
    <div class="panel">
        <div class="calendar-header-nav">
            <button type="button" onclick="changeMonth(-1)">◀ 이전달</button>
            <span id="calendar-month-title">2026년 10월</span>
            <button type="button" onclick="changeMonth(1)">다음달 ▶</button>
        </div>
        <table class="calendar-table">
            <thead>
                <tr>
                    <th style="color:#d9534f;">일</th>
                    <th>월</th><th>화</th><th>수</th><th>목</th><th>금</th>
                    <th style="color:#0275d8;">토</th>
                </tr>
            </thead>
            <tbody id="calendar-grid-body"></tbody>
        </table>
    </div>
</div>

<!-- 로그인 모달 -->
<dialog id="auth-modal-dialog">
    <h3>로그인 / 회원가입</h3>
    <input type="text" id="auth-id" placeholder="닉네임 (아이디)">
    <input type="password" id="auth-pw" placeholder="비밀번호">
    <div id="auth-error" class="error-text"></div>
    <button type="button" onclick="handleLogin()">로그인 / 가입하기</button>
    <button type="button" onclick="document.getElementById('auth-modal-dialog').close()" style="background:#aaa; margin-top:5px;">닫기</button>
</dialog>

<!-- 관리자 모달 -->
<dialog id="admin-modal-dialog">
    <h3>⚙️ 관리자 설정</h3>
    <div id="admin-login-step">
        <input type="password" id="admin-pw" placeholder="관리자 비밀번호 입력 (1230)">
        <div id="admin-error" class="error-text"></div>
        <button type="button" onclick="verifyAdminAndLoad()" style="background:#f0ad4e;">인증하기</button>
    </div>
    <div id="admin-control-panel" style="display:none; margin-top:10px;">
        <hr style="border:0; border-top:1px dashed #ccc; margin:10px 0;">
        <b style="display:block; margin-bottom:5px;">사이트 공동 목표 설정</b>
        <input type="number" id="admin-goal-cal" placeholder="목표 최대 칼로리 (kcal)">
        <input type="number" id="admin-goal-time" placeholder="목표 총 운동시간 (분)">
        <button type="button" onclick="updateAdminGoals()" style="background:#f0ad4e; margin-bottom:15px;">공동 목표 저장</button>
    </div>
    <button type="button" onclick="document.getElementById('admin-modal-dialog').close()" style="background:#aaa; margin-top:15px;">닫기</button>
</dialog>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAYUYgCP_EtInOyc6oN4OuWJw2kSJWNias",
        authDomain: "may-i-make.firebaseapp.com",
        projectId: "may-i-make",
        storageBucket: "may-i-make.firebasestorage.app",
        messagingSenderId: "798580268514",
        appId: "1:798580268514:web:736c3e69f07e812c1e2dbb",
        measurementId: "G-5SLQJGHH3K"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUser = null;

    function getTodayDateKey() {
        const now = new Date();
        if(now.getHours() < 5) now.setDate(now.getDate() - 1);
        return now.toISOString().split('T')[0];
    }
    
    let selectedDateKey = getTodayDateKey();
    
    let calendarYear = new Date().getFullYear();
    let calendarMonth = new Date().getMonth();

    function getStoredUsers() {
        try { return JSON.parse(localStorage.getItem('may_users') || '[]'); } catch(e) { return []; }
    }

    function saveStoredUser(username, color) {
        let users = getStoredUsers();
        let existing = users.find(u => u.username === username);
        if(existing) {
            existing.preferredColor = color || existing.preferredColor;
        } else {
            users.push({ username, preferredColor: color || '#ff6b6b' });
        }
        localStorage.setItem('may_users', JSON.stringify(users));
    }

    function getStoredRecord(username, dateKey) {
        try {
            const records = JSON.parse(localStorage.getItem('may_records') || '{}');
            return records[`${username}_${dateKey}`] || null;
        } catch(e) { return null; }
    }

    function saveStoredRecord(username, dateKey, data) {
        try {
            let records = JSON.parse(localStorage.getItem('may_records') || '{}');
            records[`${username}_${dateKey}`] = data;
            localStorage.setItem('may_records', JSON.stringify(records));
        } catch(e) {}
    }

    function addExerciseRow() {
        const container = document.getElementById('exercise-list-container');
        const div = document.createElement('div');
        div.className = 'flex-group exercise-row';
        div.style.marginTop = '5px';
        div.innerHTML = `
            <select class="input-body-part">
                <option value="전신">전신 운동</option>
                <option value="상체">상체 운동</option>
                <option value="하체">하체 운동</option>
                <option value="코어">코어 운동</option>
            </select>
            <input type="number" class="input-exercise-time" placeholder="운동 시간 (분)">
            <button type="button" style="background:#dc3545; width:40px; margin:0; flex-shrink:0; height:35px;" onclick="this.parentElement.remove()">-</button>
        `;
        container.appendChild(div);
    }

    async function handleLogin() {
        const id = document.getElementById('auth-id').value.trim();
        const pw = document.getElementById('auth-pw').value.trim();
        const errBox = document.getElementById('auth-error');
        errBox.style.display = 'none';

        if(!id || !pw) {
            errBox.innerText = '아이디와 비밀번호를 모두 입력해주세요.';
            errBox.style.display = 'block';
            return;
        }

        currentUser = id;
        saveStoredUser(id, '#ff6b6b');

        document.getElementById('auth-status').innerHTML = `<b>${currentUser}</b> 님 <button type="button" onclick="location.reload()" style="width:auto; padding:2px 8px;">로그아웃</button>`;
        document.getElementById('record-input-section').style.display = 'block';
        document.getElementById('auth-modal-dialog').close();
        
        db.collection("users").doc(id).set({ username: id, password: pw, createdAt: Date.now() }, { merge: true }).catch(() => {});
        loadData();
    }

    function estimateCalories(foodText) {
        let defaultCal = 300;
        if(foodText.includes('샐러드')) defaultCal = 150;
        if(foodText.includes('피자') || foodText.includes('치킨')) defaultCal = 800;
        if(foodText.includes('라면')) defaultCal = 500;
        return defaultCal;
    }

    function submitDailyRecord() {
        if(!currentUser) return alert('로그인이 필요합니다.');

        const todayGoal = document.getElementById('input-today-goal').value || '목표 없음';
        const food = document.getElementById('input-food').value || '식단 미입력';
        const water = Number(document.getElementById('input-water').value) || 0;
        const steps = Number(document.getElementById('input-steps').value) || 0;
        const distance = Number(document.getElementById('input-distance').value) || 0;
        const youtube = document.getElementById('input-youtube').value;
        const color = document.getElementById('input-color').value;

        const parts = document.querySelectorAll('.input-body-part');
        const times = document.querySelectorAll('.input-exercise-time');
        let exercises = [];
        let totalExerciseTime = 0;

        for(let i = 0; i < parts.length; i++) {
            const t = Number(times[i].value) || 0;
            if(t > 0) {
                exercises.push({ part: parts[i].value, time: t });
                totalExerciseTime += t;
            }
        }

        const estCalories = estimateCalories(food);
        const recordData = {
            username: currentUser,
            date: selectedDateKey,
            todayGoal, food, estCalories, water, steps, distance, youtube, exercises, totalExerciseTime,
            timestamp: Date.now()
        };

        saveStoredRecord(currentUser, selectedDateKey, recordData);
        saveStoredUser(currentUser, color);

        db.collection("daily_records").doc(`${currentUser}_${selectedDateKey}`).set(recordData, { merge: true }).catch(() => {});
        db.collection("users").doc(currentUser).set({ preferredColor: color }, { merge: true }).catch(() => {});

        alert(`${selectedDateKey} 기록이 영구 저장되었습니다!`);
        loadData();
    }

    async function loadRecordForEdit(username, dateKey) {
        if(currentUser !== username) return alert('본인의 기록만 수정할 수 있습니다.');
        selectedDateKey = dateKey;
        document.getElementById('input-title').innerText = `📝 ${selectedDateKey} 기록 수정하기`;

        let data = getStoredRecord(username, dateKey);
        if(!data) {
            try {
                const recSnap = await db.collection("daily_records").doc(`${username}_${dateKey}`).get();
                if(recSnap.exists) data = recSnap.data();
            } catch(e) {}
        }

        if(data) {
            document.getElementById('input-today-goal').value = data.todayGoal || '';
            document.getElementById('input-food').value = data.food || '';
            document.getElementById('input-water').value = data.water || '';
            document.getElementById('input-steps').value = data.steps || '';
            document.getElementById('input-distance').value = data.distance || '';
            document.getElementById('input-youtube').value = data.youtube || '';
        }
    }

    async function loadData() {
        document.getElementById('view-date-title').innerText = `🔥 데일리 현황 (${selectedDateKey})`;

        let usersMap = new Map();
        getStoredUsers().forEach(u => usersMap.set(u.username, u));

        try {
            const usersSnap = await db.collection("users").get();
            usersSnap.forEach(docSnap => {
                const u = docSnap.data();
                if(u.username) usersMap.set(u.username, { username: u.username, preferredColor: u.preferredColor || '#ff6b6b' });
            });
        } catch(e) {}

        if(currentUser && !usersMap.has(currentUser)) {
            usersMap.set(currentUser, { username: currentUser, preferredColor: '#ff6b6b' });
        }

        let usersList = Array.from(usersMap.values());
        const container = document.getElementById('user-rows-container');
        container.innerHTML = '';

        if(usersList.length === 0) {
            container.innerHTML = '<p style="color:#888;">등록된 사용자가 없습니다. 먼저 로그인/회원가입을 진행해 주세요!</p>';
        }

        for(let user of usersList) {
            let rec = getStoredRecord(user.username, selectedDateKey);
            if(!rec) {
                try {
                    const recSnap = await db.collection("daily_records").doc(`${user.username}_${selectedDateKey}`).get();
                    if(recSnap.exists) rec = recSnap.data();
                } catch(e) {}
            }
            if(!rec) {
                rec = { todayGoal: '목표 없음', estCalories: 0, totalExerciseTime: 0, food: '기록 없음' };
            }

            let isMyRecord = currentUser === user.username;

            let row = document.createElement('div');
            row.className = 'user-row';
            row.innerHTML = `
                <div>
                    <b>${user.username}</b> 
                    <span style="color:var(--primary); font-size:12px; margin-left:8px;">[목표: ${rec.todayGoal || '목표 없음'}]</span><br>
                    <span style="font-size:11px; color:#666;">식단: ${rec.food || '미입력'} (${rec.estCalories || 0}kcal) | 운동시간: ${rec.totalExerciseTime || 0}분</span>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    ${isMyRecord ? `<button type="button" class="edit-btn" onclick="event.stopPropagation(); loadRecordForEdit('${user.username}', '${selectedDateKey}')">✏️ 수정</button>` : ''}
                    <div style="width: 15px; height: 15px; background: ${user.preferredColor || '#ff6b6b'}; border-radius: 50%;"></div>
                </div>
            `;
            container.appendChild(row);
        }

        renderMonthlyCalendar();
    }

    function changeMonth(direction) {
        calendarMonth += direction;
        if(calendarMonth > 11) {
            calendarMonth = 0;
            calendarYear++;
        } else if(calendarMonth < 0) {
            calendarMonth = 11;
            calendarYear--;
        }
        renderMonthlyCalendar();
    }

    // 완벽하게 고정된 월별 캘린더 렌더링
    function renderMonthlyCalendar() {
        const titleEl = document.getElementById('calendar-month-title');
        titleEl.innerText = `${calendarYear}년 ${calendarMonth + 1}월`;

        const tbody = document.getElementById('calendar-grid-body');
        tbody.innerHTML = '';

        const firstDayIndex = new Date(calendarYear, calendarMonth, 1).getDay();
        const lastDay = new Date(calendarYear, calendarMonth + 1, 0).getDate();
        const todayStr = new Date().toISOString().split('T')[0];

        let tr = document.createElement('tr');
        let currentDay = 1;

        // 첫 주 공백 채우기
        for(let i = 0; i < 7; i++) {
            let td = document.createElement('td');
            if(i < firstDayIndex) {
                td.innerHTML = `<div class="cal-day empty"></div>`;
            } else {
                td.appendChild(createDayCell(currentDay, todayStr));
                currentDay++;
            }
            tr.appendChild(td);
        }
        tbody.appendChild(tr);

        // 나머지 주 채우기
        while(currentDay <= lastDay) {
            tr = document.createElement('tr');
            for(let i = 0; i < 7; i++) {
                let td = document.createElement('td');
                if(currentDay <= lastDay) {
                    td.appendChild(createDayCell(currentDay, todayStr));
                    currentDay++;
                } else {
                    td.innerHTML = `<div class="cal-day empty"></div>`;
                }
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        }
    }

    function createDayCell(dayNum, todayStr) {
        let dayCell = document.createElement('div');
        dayCell.className = 'cal-day';

        let mStr = String(calendarMonth + 1).padStart(2, '0');
        let dStr = String(dayNum).padStart(2, '0');
        let dateStr = `${calendarYear}-${mStr}-${dStr}`;

        if(dateStr === todayStr) {
            dayCell.classList.add('today');
        }
        if(dateStr === selectedDateKey) {
            dayCell.classList.add('selected');
        }

        dayCell.innerText = dayNum;
        dayCell.title = `${dateStr} 기록 보기`;

        dayCell.onclick = () => {
            selectedDateKey = dateStr;
            if(currentUser) {
                loadRecordForEdit(currentUser, dateStr);
            }
            loadData();
        };

        return dayCell;
    }

    async function verifyAdminAndLoad() {
        const pw = document.getElementById('admin-pw').value;
        const errBox = document.getElementById('admin-error');
        errBox.style.display = 'none';

        if(pw !== '1230') {
            errBox.innerText = '관리자 비밀번호가 틀렸습니다.';
            errBox.style.display = 'block';
            return;
        }
        document.getElementById('admin-control-panel').style.display = 'block';
    }

    async function updateAdminGoals() {
        const maxCalories = Number(document.getElementById('admin-goal-cal').value) || 2000;
        const totalTime = Number(document.getElementById('admin-goal-time').value) || 60;
        db.collection("settings").doc("goals").set({ maxCalories, totalTime }).then(() => {
            alert('목표가 저장되었습니다!');
        }).catch(() => {
            alert('목표 저장 완료');
        });
    }

    window.onload = () => {
        loadData();
    };
</script>

</body>
</html>
