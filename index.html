<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAY I MAKE</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --bg-color: #f4f6f9;
        }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg-color); margin: 0; padding: 10px; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h1 { margin: 0; color: var(--primary); font-size: 22px; }
        
        .main-layout { display: grid; grid-template-columns: 3fr 1fr; gap: 15px; }
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }
        
        .panel { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .user-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; border-radius: 6px; margin-bottom: 5px; }
        .user-row:hover { background: #fff0f0; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; border-radius: 4px; background: #eee; cursor: pointer; transition: transform 0.1s; }
        .cal-day:hover { transform: scale(1.05); font-weight: bold; }
        
        input, select, textarea { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
        button { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        button:hover { opacity: 0.9; }
        .flex-group { display: flex; gap: 10px; align-items: center; }
        .header-btns { display: flex; gap: 8px; align-items: center; }
        .error-text { color: #d9534f; font-size: 12px; margin-top: 5px; display: none; }
        .edit-btn { background: #6c757d; font-size: 11px; padding: 4px 8px; width: auto; margin: 0; border-radius: 4px; }
        .add-btn { background: #4caf50; width: 40px; margin: 0; flex-shrink: 0; height: 35px; }
        
        dialog { border: none; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); padding: 20px; width: 300px; }
        dialog::backdrop { background: rgba(0,0,0,0.5); }
    </style>
    
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
    <h1>MAY I MAKE</h1>
    <div class="header-btns">
        <button type="button" onclick="document.getElementById('admin-modal-dialog').showModal()" style="width:auto; padding:5px 12px; background:#6c757d;">⚙️ 관리자</button>
        <div id="auth-status">
            <button type="button" onclick="document.getElementById('auth-modal-dialog').showModal()" style="width:auto; padding:5px 15px;">로그인 / 회원가입</button>
        </div>
    </div>
</header>

<div class="main-layout">
    <div class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="view-date-title">🔥 데일리 현황 (기준: 오전 05시 ~ 익일 05시)</h3>
            <span id="global-goals-summary" style="font-size: 12px; color: #666;">공동 목표 불러오는 중...</span>
        </div>
        <div id="user-rows-container">
            <p>사용자 목록을 불러오는 중입니다...</p>
        </div>
        
        <hr style="margin: 20px 0; border:0; border-top:1px solid #eee;">
        
        <div id="record-input-section" style="display:none;">
            <h4 id="input-title">📝 오늘 진척도 및 목표 기록하기</h4>
            <div class="flex-group">
                <input type="text" id="input-today-goal" placeholder="오늘의 새로운 목표 (예: 오늘 간식 안 먹기!)" style="background: #fff9f9; border-color: #ff6b6b;">
            </div>
            <div class="flex-group">
                <input type="text" id="input-food" placeholder="먹은 것 (예: 닭가슴살 샐러드, 콜라 1캔)">
                <input type="number" id="input-water" placeholder="마신 물 (ml)">
            </div>
            <div class="flex-group">
                <input type="number" id="input-steps" placeholder="걸음 수">
                <input type="number" id="input-distance" step="0.1" placeholder="걸은 거리 (km)">
            </div>
            
            <div id="exercise-list-container">
                <div class="flex-group exercise-row">
                    <select class="input-body-part">
                        <option value="전신">전신 운동</option>
                        <option value="상체">상체 운동</option>
                        <option value="하체">하체 운동</option>
                        <option value="코어">코어 운동</option>
                    </select>
                    <input type="number" class="input-exercise-time" placeholder="운동 시간 (분)">
                    <button type="button" class="add-btn" onclick="addExerciseRow()">+</button>
                </div>
            </div>

            <input type="text" id="input-youtube" placeholder="본 유튜브 운동 영상 제목 또는 링크">
            <input type="color" id="input-color" value="#ff6b6b" title="내 진척도 그라데이션 색상 선택" style="height:35px; padding:2px;">
            <button type="button" id="save-btn" onclick="submitDailyRecord()">기록 저장 / 수정하기</button>
        </div>
    </div>

    <div class="panel">
        <h3 id="calendar-title">📅 전체 공통 캘린
